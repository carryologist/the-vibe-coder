name: Giscus Comment Slack Notification

on:
  discussion_comment:
    types: [created]

# The job only posts to an outbound Slack webhook; it never calls the
# GitHub API, so it needs no GITHUB_TOKEN scopes at all.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    # Only notify for comments in the Announcements category,
    # and skip comments from the repo owner to avoid
    # self-notifications.
    if: >-
      github.event.discussion.category.name == 'Announcements' &&
      github.event.comment.user.login != github.event.repository.owner.login
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Pass event payload fields through env vars rather than
          # `${{ ... }}` interpolation in the run script. GitHub Actions
          # evaluates `${{ ... }}` expressions *before* bash sees the
          # script, so an attacker-controlled discussion title or
          # comment author handle could otherwise inject arbitrary shell
          # commands. As env vars they reach bash as opaque strings.
          COMMENTER: ${{ github.event.comment.user.login }}
          AVATAR_URL: ${{ github.event.comment.user.avatar_url }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
        run: |
          set -euo pipefail

          # Read the comment body from the event JSON file so that
          # special characters and newlines are handled safely.
          COMMENT_BODY="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"

          # Truncate the comment body to 500 characters.
          if [ "${#COMMENT_BODY}" -gt 500 ]; then
            COMMENT_BODY="${COMMENT_BODY:0:500}..."
          fi

          # Build the blog URL from the discussion title. Giscus
          # creates titles like "posts/some-slug" (no leading slash).
          BLOG_URL="https://vibescoder.dev/${DISCUSSION_TITLE#/}"

          # Build the Slack payload with jq so every interpolated value
          # is JSON-escaped. Hand-rolled JSON with shell interpolation
          # would break (or be injectable) on any title or comment that
          # contained a quote character.
          PAYLOAD="$(jq -n \
            --arg avatar  "$AVATAR_URL" \
            --arg user    "$COMMENTER" \
            --arg url     "$COMMENT_URL" \
            --arg title   "$DISCUSSION_TITLE" \
            --arg body    "$COMMENT_BODY" \
            --arg blogUrl "$BLOG_URL" \
            '{
              blocks: [
                {
                  type: "context",
                  elements: [
                    { type: "image", image_url: $avatar, alt_text: $user },
                    { type: "mrkdwn", text: ("*" + $user + "* commented on <" + $url + "|" + $title + ">") }
                  ]
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $body }
                },
                {
                  type: "actions",
                  elements: [
                    { type: "button", text: { type: "plain_text", text: "Reply on GitHub" }, url: $url },
                    { type: "button", text: { type: "plain_text", text: "View on Blog" }, url: $blogUrl }
                  ]
                }
              ]
            }')"

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data-raw "$PAYLOAD"
